<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration Review | Fix Your Tree</title>
  <link rel="stylesheet" href="styles.css?v=administration-review-1">
</head>
<body>
  <div class="container">
    <header>
      <h1>Administration Review</h1>
      <p>Enter the administration passphrase to review each subscription at no charge.</p>
    </header>

    <main>
      <section class="subscription-section">
        <h2>Unlock administration review</h2>
        <p class="section-subtitle">This unlock lasts for the current browser tab only. Close the tab to lock it again.</p>

        <form id="adminUnlockForm">
          <div class="form-group">
            <label for="adminPassphrase">Administration passphrase</label>
            <input type="password" id="adminPassphrase" name="adminPassphrase" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-add">Unlock administration review</button>
        </form>

        <p id="adminStatus" class="status-message" role="status"></p>

        <p><a href="index.html">Return to the family tree checker</a></p>
      </section>
    </main>
  </div>

  <!--
    To rotate the passphrase, run this in a browser console and replace
    ADMIN_REVIEW_TOKEN in admin-review-gate.js with the printed digest:

      crypto.subtle.digest('SHA-256', new TextEncoder().encode('new passphrase'))
        .then((d) => console.log([...new Uint8Array(d)]
          .map((b) => b.toString(16).padStart(2, '0')).join('')));
  -->
  <script src="admin-review-gate.js?v=administration-passphrase-1"></script>
  <script src="admin.js?v=administration-passphrase-1"></script>
</body>
</html>
