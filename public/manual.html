<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build a Family Tree | Genealogy Tree Checker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Build a Family Tree</h1>
      <p>Add people to the family tree saved in this browser.</p>
    </header>
    <main>
      <section class="form-section">
        <h2>Add a family member</h2>
        <form id="familyForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter name" required>
          </div>
          <div class="form-group">
            <label for="relation">Relation</label>
            <select id="relation" required>
              <option value="">Select relation</option>
              <option value="Parent">Parent</option>
              <option value="Sibling">Sibling</option>
              <option value="Child">Child</option>
              <option value="Grandparent">Grandparent</option>
              <option value="Grandchild">Grandchild</option>
              <option value="Spouse">Spouse</option>
              <option value="Cousin">Cousin</option>
              <option value="Aunt/Uncle">Aunt/Uncle</option>
              <option value="Niece/Nephew">Niece/Nephew</option>
            </select>
          </div>
          <div class="form-group">
            <label for="birthYear">Birth year</label>
            <input type="number" id="birthYear" placeholder="e.g., 1980" min="1" max="2026">
          </div>
          <button type="submit" class="btn-add">Add family member</button>
        </form>
        <p id="manualStatus" class="status-message" aria-live="polite"></p>
      </section>
      <section class="tree-section">
        <h2>Your people</h2>
        <div id="peopleList" class="family-tree"></div>
      </section>
    </main>
    <footer><a href="index.html">Return to GEDCOM overview</a></footer>
  </div>
  <script src="client-storage.js"></script>
  <script src="manual.js"></script>
<script type="module" src="/speed-insights-init.js"></script>
</body>
</html>
